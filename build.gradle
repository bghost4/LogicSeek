plugins {
    id 'java'
    id("org.beryx.jlink") version "4.1.1"
    id("org.openjfx.javafxplugin") version "0.1.0"
}

group = 'com.derpderp'
// Major.minor is the intentional, hand-picked part; CI parses it and appends its own build number as the patch.
version = '0.0.1'

repositories {
    mavenCentral()
}

javafx {
    modules = [ 'javafx.controls', 'javafx.fxml' ]
}

jlink {
    jpackage {
        imageName = 'LogicSeek'
        installerName = 'LogicSeek'
        appVersion = (findProperty('appVersion') ?: project.version).toString()
        vendor = 'derpderp'
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            installerOptions = ['--win-shortcut', '--win-menu']
            icon = file('packaging/icons/icon.ico')
        } else {
            icon = file('packaging/icons/icon.png')
        }
    }
}

application {
    mainClass = "com.derpderphurr.duku.Main"
    mainModule = "duku"
}


dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}