name: Windows CI Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Check out the source code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up the specific Java Development Kit (JDK)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '23'
          distribution: 'temurin'
          cache: 'gradle'

      # 3. Grant execute permissions to the Gradle wrapper (insurance for Git layer)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 4. Run the Beryx JLink task to create the optimized zip distribution
      - name: Build JLink Runtime Image
        run: ./gradlew jlinkZip

      # 5. (Optional) Run JPackage if you want an installable .exe or .msi file
      # Note: windows-latest has Wix Toolset pre-installed for making MSIs
      - name: Build Installable Package
        run: ./gradlew jpackage

      # 6. Upload your build artifacts so you can download them from GitHub
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-App-Distributions
          path: |
            build/image-zip/
            build/jpackage/